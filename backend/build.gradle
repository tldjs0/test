plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.gojeom'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    awsSdkVersion = '2.29.9'
    googleApiClientVersion = '2.7.0'
}

dependencies {
    // --- Web / API ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Persistence ---
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'   // Flyway 10 + PostgreSQL 필수 모듈
    runtimeOnly 'org.postgresql:postgresql'

    // --- Security ---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Google ID 토큰 검증. 직접 구현하지 않는다 —
    // JWKS 캐싱과 키 롤오버까지 라이브러리가 처리한다. (TASKS.md D3-6)
    implementation "com.google.api-client:google-api-client:${googleApiClientVersion}"

    // --- Storage (S3 호환 · presigned URL) ---
    // S3Presigner는 s3 모듈에 포함되어 있다. 별도 아티팩트가 아니다.
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'

    // --- Image validation ---
    // OpenPnP 패키지가 운영체제별 OpenCV 네이티브 바이너리를 함께 제공한다.
    implementation 'org.openpnp:opencv:4.9.0-0'
    // OpenCV 공식 frontal-face cascade 리소스만 사용한다. OpenIMAJ 코드는 로드하지 않으며,
    // 오래된 전이 의존성이 compileClasspath로 들어오지 않도록 반드시 비활성화한다.
    runtimeOnly('org.openimaj:object-detection:1.3.10') {
        transitive = false
    }

    // --- Ops ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- Test ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'   // JSONB 검증 때문에 H2를 쓰지 않는다
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 테스트를 두 갈래로 나눈다.
//
// 배경: 개발 환경에 Docker가 없으면 Testcontainers가 뜨지 않아 `./gradlew test`가
// 통째로 실패했다. 그러면 Docker 없이도 돌릴 수 있는 가드레일·스키마 단위 테스트까지
// 같이 못 돌게 되어, 결국 아무도 테스트를 돌리지 않게 된다.
//
// 통합 테스트는 IntegrationTestSupport 를 상속하고 @Tag("integration") 을 물려받는다.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// Docker가 있는 환경에서만 실행한다. (Testcontainers PostgreSQL)
tasks.register('integrationTest', Test) {
    description = 'Testcontainers가 필요한 통합 테스트. Docker 필요.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
}
