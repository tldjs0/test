# 로컬 개발용 오버라이드
# 실행: SPRING_PROFILES_ACTIVE=local ./gradlew bootRun
#
# 시크릿은 여기에 적지 않는다. .env 또는 IDE 실행 구성의 환경 변수로 주입한다.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gojeom}
    username: ${DB_USERNAME:gojeom}
    password: ${DB_PASSWORD:gojeom}
  jpa:
    properties:
      hibernate:
        show_sql: true

logging:
  level:
    com.gojeom: DEBUG
    # SQL 문만 남긴다. 값은 ?로 마스킹된 상태로 나온다.
    org.hibernate.SQL: DEBUG
    #
    # org.hibernate.orm.jdbc.bind: TRACE 를 켜지 말 것.
    #
    # 바인딩 파라미터를 전부 찍기 때문에 로그에 아래가 그대로 남는다.
    #   - profiles/{userId}/... · references/{userId}/... 스토리지 key
    #   - analyses.input_text — 사용자가 적은 고점 원문
    #   - analysis_results 의 AI 생성 문구 전체
    # 얼굴 사진은 생체정보에 준하고, 고점 원문은 프롬프트 입력이다.
    # (AGENTS.md 규칙 9 · PRD §9 "원본 사진과 프롬프트 원문은 저장하지 않는다")
    #
    # 쿼리 파라미터를 꼭 봐야 하면 그 순간에만 켜고, 남은 로그 파일을 지운다.
