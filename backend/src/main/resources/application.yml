spring:
  application:
    name: gojeom

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000

  jpa:
    hibernate:
      # 스키마 소유권은 Flyway에 있다. update로 두면 팀원 간 스키마가 갈라진다.
      ddl-auto: validate
    # 기본값 true는 뷰 렌더링까지 커넥션을 잡는다. AI 대기가 긴 서비스에서 커넥션 고갈 원인.
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      enabled: false   # 이미지는 presigned URL로 스토리지에 직접 PUT한다 (ARCHITECTURE.md A-1)

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  access-minutes: 30
  refresh-days: 14

google:
  # 프론트와 공유하는 웹 클라이언트 ID. 시크릿은 필요 없다 (ID 토큰 검증 방식).
  # 비어 있으면 Google 로그인만 비활성화되고 나머지는 정상 동작한다.
  client-id: ${GOOGLE_CLIENT_ID:}

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com/v1
  model:
    text: ${OPENAI_MODEL_TEXT}
    image: ${OPENAI_MODEL_IMAGE}
  timeout:
    connect-seconds: 5
    read-seconds: 60
  max-retries: 2

storage:
  endpoint: ${STORAGE_ENDPOINT}
  region: ${STORAGE_REGION:ap-northeast-2}
  bucket: ${STORAGE_BUCKET}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  presign:
    upload-seconds: 300
    download-seconds: 600
  max-upload-bytes: 10485760   # 10MB

analysis:
  timeout-seconds: 60
  sweep-after-minutes: 3

logging:
  level:
    com.gojeom: INFO
