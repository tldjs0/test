# 통합 테스트용. DB 접속 정보는 Testcontainers가 @DynamicPropertySource로 주입한다.

jwt:
  secret: test-secret-key-for-integration-tests-only-32bytes
  access-minutes: 30
  refresh-days: 14

openai:
  api-key: test-key
  base-url: http://localhost:0
  model:
    text: test-text-model
    image: test-image-model
  timeout:
    connect-seconds: 1
    read-seconds: 1
  max-retries: 0

storage:
  endpoint: http://localhost:0
  region: ap-northeast-2
  bucket: test-bucket
  access-key: test
  secret-key: test
  presign:
    upload-seconds: 300
    download-seconds: 600
  max-upload-bytes: 10485760

cors:
  allowed-origins: http://localhost:5173

analysis:
  timeout-seconds: 60
  sweep-after-minutes: 3
